name: Folio
options:
  bundleIdPrefix: me.scott
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "8Q37XBPJ6W"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Folio:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
        type: group
      - path: Resources
        type: group
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: Eigenwort
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        LSApplicationCategoryType: public.app-category.reference
        LSRequiresIPhoneOS: YES
        NSLocationWhenInUseUsageDescription: "Eigenwort queries Wikipedia's geosearch endpoint to find articles near you. Your location is not sent or saved anywhere else."
        UIAppFonts:
          - EBGaramond-Regular.otf
          - EBGaramond-Medium.otf
          - EBGaramond-Italic.otf
          - EBGaramond-Bold.otf
          - EBGaramond-MediumItalic.otf
          - EBGaramond-BoldItalic.otf
          - Besley-Regular.ttf
          - Besley-Italic.ttf
          - Besley-Bold.ttf
          - Besley-BoldItalic.ttf
          - BarlowSemiCondensed-Regular.ttf
          - BarlowSemiCondensed-Bold.ttf
          - ComicNeue-Regular.ttf
          - ComicNeue-Italic.ttf
          - ComicNeue-Bold.ttf
          - ComicNeue-BoldItalic.ttf
          - AlfaSlabOne-Regular.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: NO
        CFBundleURLTypes:
          - CFBundleURLName: me.scott.folio
            CFBundleURLSchemes:
              - eigenwort
        UIRequiresFullScreen: NO
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: OpenInEigenwort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.scott.folio
        PRODUCT_NAME: Folio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # "Open in Eigenwort" in the share sheet, for any web link; it opens the
  # app through the eigenwort scheme and shares the link parser's source.
  OpenInEigenwort:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OpenIn
        type: group
        excludes:
          - Info.plist
      - path: Sources/Data/WikipediaLink.swift
    info:
      path: OpenIn/Info.plist
      properties:
        CFBundleDisplayName: Open in Eigenwort
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).OpenInViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.scott.folio.open
        PRODUCT_NAME: OpenInEigenwort
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  FolioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.scott.folio.tests
        GENERATE_INFOPLIST_FILE: YES
